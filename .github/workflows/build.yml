name: Build Qt

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux

          - os: ubuntu-24.04-arm
            name: Linux-aarch64

          - os: windows-2022
            name: Windows-MSVC
            arch: amd64

          - os: windows-2025
            name: Windows-MinGW-w64

          - os: windows-11-arm
            name: Windows-MSVC-arm64
            arch: arm64

          - os: macos-26
            name: macOS
    env:
      QT_VERSION: "6.12.0"
      QT_MINOR: "6.12"
      QT_TAR: "qt-everywhere-src-6.12.0"
      QT_SHA256: "98ff4f44bac6ec3e1e62ee2a4316ae0e3d15badb015d753cc0268a20db52f165"
      PATCHES_DIR: "${{ github.workspace }}/patches"
      SSL_SHA256: "603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup MSYS2 (Windows MinGW)
        if: matrix.name == 'Windows-MinGW-w64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          pacboy: clang:p compiler-rt:p libc++:p lld:p llvm-tools:p cmake:p ninja:p postgresql:p

      - name: Setup MSVC
        if: matrix.name == 'Windows-MSVC' || matrix.name == 'Windows-MSVC-arm64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Setup Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config perl zstd \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev libxrender-dev \
            libxcb1-dev libxcb-cursor-dev libxcb-glx0-dev libxcb-icccm4-dev \
            libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev \
            libxcb-render0-dev libxcb-render-util0-dev libxcb-shape0-dev \
            libxcb-shm0-dev libxcb-sync-dev libxcb-util-dev libxcb-xfixes0-dev \
            libxcb-xinerama0-dev libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype-dev libdrm-dev libvulkan-dev \
            libcups2-dev libdbus-1-dev libssl-dev

      - name: Setup Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
            brew install cmake ninja pkg-config perl zstd coreutils

      # qt on macos by default relies on secure transport that is deprecated. Apple could remove it at any moment and it doesn't support tls 1.3. let's just use openssl
      - name: Configure, build, install OpenSSL on macOS
        if: runner.os == 'macOS'
        run: |
          curl -fLO "https://www.openssl.org/source/openssl-3.5.9.tar.gz"
          printf "%s  %s\n" "$SSL_SHA256" openssl-3.5.9.tar.gz | sha256sum -c -
          tar -xzf "openssl-3.5.9.tar.gz"
          #workaround, see https://qt-project.atlassian.net/browse/QTBUG-141933
          git apply --whitespace=nowarn --directory=openssl-3.5.9 "$PATCHES_DIR/openssl/0001-remove-x86_64-cpuid-setup-constructor.patch"
          openssl_src="${{ github.workspace }}/openssl-3.5.9"
          # we have to build twice: once for intel and the other time for apple silicon, then we use lipo to merge them together
          cd openssl-3.5.9
          mkdir intelbuild && cd intelbuild
          perl ../Configure darwin64-x86_64 no-shared no-tests no-docs no-module no-apps --prefix="$openssl_src/x86_64" --openssldir="$openssl_src/x86_64/ssl" --libdir=lib --release -mmacosx-version-min=14.4
          make -j"$(sysctl -n hw.ncpu)"
          make install_sw
          cd ..
          mkdir applebuild && cd applebuild
          perl ../Configure darwin64-arm64 no-shared no-tests no-docs no-module no-apps --prefix="$openssl_src/arm64" --openssldir="$openssl_src/arm64/ssl" --libdir=lib --release -mmacosx-version-min=14.4
          make -j"$(sysctl -n hw.ncpu)"
          make install_sw
          cd ..
          cp -R arm64 universal
          for lib in universal/lib/*.a; do
            name=$(basename "$lib")
            lipo -create -output "$lib.lipo" "$lib" "x86_64/lib/$name"
            mv "$lib.lipo" "$lib"
          done

      - name: Download Qt from download.qt.io
        shell: bash
        run: |
          curl -fLO "https://download.qt.io/official_releases/qt/$QT_MINOR/$QT_VERSION/single/$QT_TAR.tar.xz"
          printf "%s  %s\n" "$QT_SHA256" "$QT_TAR.tar.xz" | sha256sum -c -

      - name: Patch Qt
        shell: bash
        run: |
          tar -xf $QT_TAR.tar.xz
          if [ -d "$PATCHES_DIR" ]; then
            find "$PATCHES_DIR" -type f \( -name '*.patch' -o -name '*.diff' \) | sort | while IFS= read -r p; do
              m=$(basename "$(dirname "$p")")
              if [ -d "$QT_TAR/$m" ]; then
                echo "Applying $p to $m"
                git apply --whitespace=nowarn --directory="$QT_TAR/$m" "$p" || exit 1
              fi
            done
          fi
          cd "$QT_TAR"
          mkdir build && mkdir qt

      - name: Configure, Build and Install Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          cd "$QT_TAR/build"
          # since we don't do -no-icu qt depends on the icu provided by the system package whose lib could change on ubuntu version
          # I guess a fair compromise for proper internationalization support...
          ../configure -prefix ../qt/ -release -opensource -confirm-license -nomake examples -nomake tests -submodules qtbase,qtimageformats,qtnetworkauth,qtsvg -openssl-linked -qt-zlib -qt-libpng -qt-libjpeg -qt-freetype -qt-pcre -qt-harfbuzz -qt-tiff -qt-webp -qt-sqlite -qt-doubleconversion
          cmake --build .
          cmake --install .

      - name: Configure, Build and Install Qt (macOS)
        if: runner.os == 'macOS'
        run: |
          openssl_dir="${{ github.workspace }}/openssl-3.5.9/universal"
          cd "$QT_TAR/build"
          ../configure -prefix ../qt/ -release -opensource -confirm-license -nomake examples -nomake tests -submodules qtbase,qtimageformats,qtnetworkauth,qtsvg -openssl-linked -qt-zlib -qt-libpng -qt-libjpeg -qt-freetype -qt-pcre -qt-harfbuzz -qt-tiff -qt-webp -qt-sqlite -qt-doubleconversion -- -DOPENSSL_ROOT_DIR="$openssl_dir" -DOPENSSL_INCLUDE_DIR="$openssl_dir/include" -DOPENSSL_SSL_LIBRARY="$openssl_dir/lib/libssl.a" -DOPENSSL_CRYPTO_LIBRARY="$openssl_dir/lib/libcrypto.a" -DOPENSSL_USE_STATIC_LIBS=ON -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=14.4
          cmake --build .
          cmake --install .

      - name: Configure, Build and Install Qt (Windows MSVC)
        if: matrix.name == 'Windows-MSVC' || matrix.name == 'Windows-MSVC-arm64'
        shell: pwsh
        run: |
          Set-Location "$env:QT_TAR/build"
          & "..\configure.bat" -prefix ../qt/ -release -opensource -confirm-license -nomake examples -nomake tests -submodules qtbase,qtimageformats,qtnetworkauth,qtsvg -no-openssl -schannel -qt-zlib -qt-libpng -qt-libjpeg -qt-freetype -qt-pcre -qt-harfbuzz -qt-tiff -qt-webp -qt-sqlite -qt-doubleconversion
          cmake --build .
          cmake --install .

      - name: Configure, Build and Install Qt (Windows MinGW)
        if: matrix.name == 'Windows-MinGW-w64'
        shell: msys2 {0}
        run: |
          cd "$QT_TAR/build"
          cmd //c "..\configure.bat" -prefix ../qt/ -release -opensource -confirm-license -nomake examples -nomake tests -submodules qtbase,qtimageformats,qtnetworkauth,qtsvg -no-openssl -schannel -qt-zlib -qt-libpng -qt-libjpeg -qt-freetype -qt-pcre -qt-harfbuzz -qt-tiff -qt-webp -qt-sqlite -qt-doubleconversion
          cmake --build .
          cmake --install .

      - name: Package Qt
        shell: bash
        run: |
          tar -caf "qt-${{ matrix.name }}-${{ env.QT_VERSION }}.tar.zst" -C "$QT_TAR" qt

      - name: Upload compiled Qt
        uses: actions/upload-artifact@v7
        with:
          path: qt-${{ matrix.name }}-${{ env.QT_VERSION }}.tar.zst
          archive: false
