name: Build Qt and make a release

on:
    push:
        tags:
        - "*"

jobs:
    build_qt:
        name: Build Qt
        uses: ./.github/workflows/build.yml
    release_qt:
        needs: build_qt
        runs-on: ubuntu-slim
        permissions:
            contents: write
        steps:
            - name: Download artifacts
              uses: actions/download-artifact@v8
              with:
                  merge-multiple: true

            - name: Rename artifacts to tag name and generate sha256
              run: |
                tag_name=$(echo ${{ github.ref }} | grep -oE "[^/]+$")
                for f in *.tar.zst; do
                  # strip the version (last "-<version>.tar.zst" component) and use the tag instead
                  name="${f%.tar.zst}"
                  prefix="${name%-*}"
                  new="${prefix}-${tag_name}.tar.zst"
                  if [ "$f" != "$new" ]; then mv "$f" "$new"; fi
                done
                for f in *.tar.zst; do sha256sum "$f" > "$f.sha256"; done

            - name: Release
              uses: softprops/action-gh-release@v3
              with:
                fail_on_unmatched_files: true
                files: |
                  *.tar.zst
                  *.tar.zst.sha256
